<!DOCTYPE html>

    <style>
      .support-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 50;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 40px;
        padding: 6px 12px;
        border-radius: 8px;
        background: #e8c87a;
        color: #1f2430;
        font-weight: 700;
        font-size: 14px;
        line-height: 1.4;
        text-decoration: none;
        border: 1px solid rgba(31, 36, 48, 0.35);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      .support-btn:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 2px;
      }
      .support-btn[hidden] {
        display: none !important;
      }
      @media print {
        .support-btn {
          display: none !important;
        }
      }
    </style>
    <!-- Keep browser zoom accessible; the map/canvas handles its own gestures. -->

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/v0.1.0/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/v0.1.0/apple-touch-icon.png" />

    <meta property="og:title" content="map3d · 3D 定向地圖" />
