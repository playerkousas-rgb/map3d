name: CI

# Same gate as `npm run check`: lint + lint-config contracts + repo hygiene guard + type-check +
# production build + bundle budget, dependency audit and isolated dev + production-CSP Chromium tests.
# Runs on PRs and on pushes to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Quality/build + complete dev Chromium; no retries/skips.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Current Node 22; ESLint 10 requires >=22.13 within this major.
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run audit:deps
      - run: npx playwright-core install --with-deps chromium
      - uses: actions/upload-artifact@v4
        with:
          name: verified-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - run: npm run verify:ui:isolated -- dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: node_modules/.cache/ui-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  cad:
    needs: check
    # Same10min budget now includes the entire built-production CSP stage.
    # Consume this run's exact built dist + dev downloads, then audit all63 DXFs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/cad-requirements.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:dxf-writer
      - run: python -m pip install -r scripts/cad-requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: browser-screenshots
          path: node_modules/.cache/browser-downloads
      - uses: actions/download-artifact@v4
        with:
          name: verified-dist
          path: dist
      - run: npx playwright-core install --with-deps chromium
      - run: npm run verify:ui:isolated -- production
        env:
          UI_ARTIFACT_DIR: node_modules/.cache/browser-downloads
      - run: npm run verify:cad
        env:
          CAD_BROWSER_DIR: node_modules/.cache/browser-downloads
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-conformance-fixtures
          path: node_modules/.cache/cad-fixtures/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-browser-screenshots
          path: node_modules/.cache/browser-downloads/
          if-no-files-found: error
          retention-days: 7
